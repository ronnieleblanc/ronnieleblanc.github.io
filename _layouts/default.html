<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg: #0a0e27;
      --bg-secondary: #0f1428;
      --card-bg: rgba(20, 29, 50, 0.5);
      --card-border: rgba(100, 116, 139, 0.2);
      --card-hover-border: rgba(56, 189, 248, 0.5);
      --text: #cbd5e1;
      --text-bright: #f1f5f9;
      --heading: #ffffff;
      --accent: #38bdf8;
      --accent-secondary: #06b6d4;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-glow: rgba(56, 189, 248, 0.1);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
      }
      50% {
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding-bottom: 5rem;
      min-height: 100vh;
    }

    /* Sticky Navigation Bar */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 14, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.1);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideInDown 0.6s ease-out;
    }

    .nav-brand {
      font-weight: 700;
      color: var(--heading);
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Section Styling */
    section {
      padding: 6rem 0 3rem 0;
      animation: fadeInUp 0.8s ease-out;
    }

    section:nth-of-type(1) { animation-delay: 0.2s; }
    section:nth-of-type(2) { animation-delay: 0.3s; }
    section:nth-of-type(3) { animation-delay: 0.4s; }
    section:nth-of-type(n+4) { animation-delay: 0.5s; }

    .section-label {
      font-family: var(--font-mono);
      color: var(--accent-secondary);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    h2 {
      color: var(--heading);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      background: linear-gradient(135deg, var(--heading), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Hero Typography */
    .hero-title {
      font-size: 3.5rem;
      line-height: 1.1;
      color: var(--heading);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--accent), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 2rem;
      max-width: 750px;
      line-height: 1.8;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    /* Cards & Grids */
    .metrics-grid, .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .metric-card, .skill-card, .experience-card, .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s ease-out both;
      position: relative;
      overflow: hidden;
    }

    .metric-card:nth-child(1) { animation-delay: 0.1s; }
    .metric-card:nth-child(2) { animation-delay: 0.2s; }
    .metric-card:nth-child(3) { animation-delay: 0.3s; }
    .skill-card:nth-child(1) { animation-delay: 0.1s; }
    .skill-card:nth-child(2) { animation-delay: 0.2s; }
    .skill-card:nth-child(3) { animation-delay: 0.3s; }
    .skill-card:nth-child(4) { animation-delay: 0.4s; }
    .experience-card:nth-child(1) { animation-delay: 0.1s; }
    .experience-card:nth-child(2) { animation-delay: 0.2s; }
    .project-card:nth-child(1) { animation-delay: 0.1s; }
    .project-card:nth-child(2) { animation-delay: 0.2s; }
    .project-card:nth-child(3) { animation-delay: 0.3s; }

    .metric-card::before,
    .skill-card::before,
    .experience-card::before,
    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .metric-card:hover::before,
    .skill-card:hover::before,
    .experience-card:hover::before,
    .project-card:hover::before {
      left: 100%;
    }

    .experience-card:hover, 
    .project-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
    }

    .metric-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .skill-card:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 20px rgba(192, 132, 252, 0.2);
    }

    .metric-val {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--heading);
      font-family: var(--font-mono);
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .metric-label {
      font-size: 0.9rem;
      color: var(--text);
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      gap: 0.5rem;
    }

    .role-title {
      font-size: 1.25rem;
      color: var(--heading);
      font-weight: 700;
    }

    .company {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
    }

    /* Contact Links */
    .contact-links { 
      display: flex; 
      gap: 1rem; 
      flex-wrap: wrap; 
      margin-top: 2rem; 
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 1.75rem;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(192, 132, 252, 0.05));
      border: 1px solid var(--card-border);
      color: var(--heading);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.1));
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: 1rem; 
      }
      .nav-links { 
        gap: 1.5rem; 
        font-size: 0.85rem; 
      }
      .hero-title { 
        font-size: 2.5rem; 
      }
      h2 {
        font-size: 1.75rem;
      }
      .metrics-grid, .skills-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
    }

    @media (max-width: 640px) {
      nav { 
        padding: 1rem 1rem; 
      }
      .nav-brand { 
        font-size: 1rem; 
      }
      .nav-links { 
        gap: 1rem; 
      }
      .hero-title { 
        font-size: 2rem; 
      }
      h2 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .metrics-grid, .skills-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
      .metric-card, .skill-card, .experience-card, .project-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">RL | Client Platform Engineer</span>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    {{ content }}
  </div>

</body>
</html>
