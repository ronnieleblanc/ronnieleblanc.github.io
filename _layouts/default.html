<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.3);
      --text: #94a3b8;
      --text-bright: #f8fafc;
      --heading: #ffffff;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --accent-purple: #c084fc;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding-bottom: 5rem;
    }

    /* Sticky Navigation Bar */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-weight: 700;
      color: var(--heading);
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-family: var(--font-mono);
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Section Styling */
    section {
      padding: 5rem 0 2rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    section:last-of-type {
      border-bottom: none;
    }

    .section-label {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    h1 {
      color: var(--heading);
      font-size: 3rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.5rem;
      border-radius: 8px;
      display: inline-block;
    }

    h2 {
      color: var(--heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      margin-top: 3rem;
    }

    h3 {
      color: var(--heading);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    h4 {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    p {
      margin-bottom: 1rem;
      max-width: 750px;
    }

    /* Contact Links */
    .contact-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--heading);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Table-to-Card Grid */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    thead {
      display: none;
    }

    tbody {
      display: contents;
    }

    tr {
      display: contents;
    }

    td {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 1.5rem;
      border-radius: 8px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    tr:hover td {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
    }

    /* First column = title/header */
    td:first-child {
      font-weight: 700;
      color: var(--heading);
      font-size: 1rem;
      margin-bottom: 0.75rem;
      min-height: 2.5rem;
    }

    /* Subsequent columns = content */
    td:not(:first-child) {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Experience/Role Table Specifics */
    .experience-table td:nth-child(2) {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      margin-top: -0.5rem;
    }

    .experience-table td:nth-child(3) {
      font-size: 0.85rem;
      color: var(--text);
      margin-top: 0.5rem;
      flex-grow: 1;
    }

    /* Lists within cards */
    td ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    td ul li {
      margin-bottom: 0.5rem;
      padding-left: 1.25rem;
      position: relative;
    }

    td ul li:before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    /* Hero subtitle styling */
    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-bright);
      margin-bottom: 1.5rem;
      max-width: 750px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }

      .nav-links {
        gap: 1rem;
        font-size: 0.85rem;
      }

      h1 {
        font-size: 2.25rem;
      }

      table {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Ronnie LeBlanc | Client Platform Engineer</span>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#highlights">Highlights</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    {{ content }}
  </div>

</body>
</html>
