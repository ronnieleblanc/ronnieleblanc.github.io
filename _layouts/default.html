<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg: #0a0e27; --bg-secondary: #0f1428; --card-bg: rgba(20, 29, 50, 0.5);
      --card-border: rgba(100, 116, 139, 0.2); --card-hover-border: rgba(56, 189, 248, 0.5);
      --text: #cbd5e1; --text-bright: #f1f5f9; --heading: #ffffff;
      --accent: #38bdf8; --accent-secondary: #06b6d4; --accent-purple: #c084fc;
      --accent-pink: #f472b6; --accent-glow: rgba(56, 189, 248, 0.1); --rule: rgba(56, 189, 248, 0.1);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
      --font-serif: Georgia, 'Times New Roman', serif;
    }
    body.light {
      --bg: #f5f2eb; --bg-secondary: #edeae0; --card-bg: rgba(245, 242, 235, 0.8);
      --card-border: rgba(26, 71, 42, 0.15); --card-hover-border: rgba(26, 71, 42, 0.3);
      --text: #5a5952; --text-bright: #2a2a2a; --heading: #0f0f0e;
      --accent: #1a472a; --accent-secondary: #2d6a42; --accent-purple: #6b4c9a;
      --accent-pink: #c2185b; --accent-glow: rgba(26, 71, 42, 0.08); --rule: rgba(26, 71, 42, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%); color: var(--text); font-family: var(--font-sans); line-height: 1.6; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 1000; background: rgba(10, 14, 39, 0.75); backdrop-filter: blur(16px); border-bottom: 1px solid var(--rule); padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    body.light nav { background: rgba(245, 242, 235, 0.92); }
    .nav-brand { font-weight: 700; font-size: 1.1rem; background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .theme-toggle { background: none; border: 1px solid var(--rule); padding: 0.5rem 1rem; color: var(--text); font-family: var(--font-mono); border-radius: 6px; cursor: pointer; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
    section { padding: 5rem 0 2rem; border-top: 1px solid var(--rule); }
    section:first-of-type { border-top: none; }
    footer { text-align: center; padding: 2rem; border-top: 1px solid var(--rule); font-size: 0.85rem; }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">RL | Staff Platform Engineer</span>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#impact">Impact</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#mentorship">Mentorship</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle">Dark</button>
  </nav>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} Ronnie LeBlanc</p>
  </footer>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'light') {
      body.classList.add('light');
      toggleBtn.textContent = 'Light';
    }
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      const isLight = body.classList.contains('light');
      toggleBtn.textContent = isLight ? 'Light' : 'Dark';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>
</body>
</html>
