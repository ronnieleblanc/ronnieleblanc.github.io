<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Platform & Endpoint Engineer | Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --heading: #f0f6fc;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    header {
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }
    h1 {
      color: var(--heading);
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 1.15rem;
      color: var(--accent);
      margin-top: 0.25rem;
      font-family: var(--font-mono);
    }
    .bio {
      margin-top: 1rem;
      font-size: 1.05rem;
      color: var(--text);
      max-width: 750px;
    }
    .links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      color: var(--heading);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-family: var(--font-mono);
      transition: all 0.2s ease;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* Sections */
    section {
      margin-bottom: 3rem;
    }
    h2 {
      color: var(--heading);
      font-size: 1.3rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
    }
    h2::before {
      content: "//";
      color: var(--accent);
    }

    /* Grid layout for Skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
